[build]
# Default to the bare-metal kernel target; host tools can override with --target.
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=-nostartfiles",
    "-C", "code-model=kernel",
    "-C", "panic=abort",
    "-C", "relocation-model=static",
    "-C", "force-frame-pointers=yes",
    "-C", "link-arg=--script=kernel/src/arch/x86_64/linker.ld",
]

[unstable]
build-std = ["core", "compiler_builtins", "alloc"]
build-std-features = ["compiler-builtins-mem"]
