[package]
name = "keefeos-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Experimental x86_64 bare-metal kernel"

# The kernel is a binary crate that produces a bare-metal executable
[[bin]]
name = "keefeos-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
keefeos-boot-protocol = { path = "../boot-protocol" }
# Core architecture dependencies
x86_64.workspace = true
volatile.workspace = true
bitflags.workspace = true
log.workspace = true
spin.workspace = true

# uefi for memory map parsing (used during boot, then can be minimized)
uefi = { workspace = true, optional = true }

# Optional dependencies for different phases
[features]
default = ["uefi-boot"]
uefi-boot = ["dep:uefi"]
# The page-table managers are legacy prototypes and are disabled until migrated.
experimental-paging = []
# Unsafe legacy VGA text-memory output is disabled unless a target explicitly opts in.
# Do not enable without proving 0xB8000 is mapped as VGA text memory on the target.
legacy-vga-console = []

# No standard library - pure bare-metal
[lib]
path = "src/lib.rs"
