name: CodeQL security analysis

on:
  push:
    branches: ["main"]
    # CodeQL examines source and workflow changes, not documentation-only edits.
    paths:
      - "KeefeOS/**"
      - ".github/workflows/**"
      - ".github/codeql/**"
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

# Keep workflow-wide permissions read-only. The analyze job adds only the
# security-events permission required to upload CodeQL results.
# Cancel stale scans for the same branch/PR to conserve CI minutes.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "rust"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          # Rust is analyzed with CodeQL's supported no-build extraction.
          # GitHub Actions workflows are interpreted and do not need a build.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: "/language:${{ matrix.language }}"
