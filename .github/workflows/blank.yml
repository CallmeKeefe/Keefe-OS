name: KeefeOS CI

on:
  push:
    branches: ["main"]
    paths:
      - "KeefeOS/**"
      - ".github/workflows/**"
      - "README.md"
      - "SECURITY.md"
      - "docs/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build kernel, UEFI loader, and disk image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KeefeOS
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install nightly Rust and bare-metal targets
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Check host-side xtask
        run: cargo check --locked --package xtask --target x86_64-unknown-linux-gnu

      - name: Test boot protocol and ELF parser
        run: cargo test --locked --package keefeos-boot-protocol --target x86_64-unknown-linux-gnu

      - name: Run host-side kernel unit tests
        run: cargo test --locked --package keefeos-kernel --lib --target x86_64-unknown-linux-gnu

      - name: Build kernel ELF
        run: cargo build --locked --package keefeos-kernel --target x86_64-unknown-none

      - name: Build UEFI bootloader
        run: cargo build --locked --package keefeos-bootloader --target x86_64-unknown-uefi

      - name: Assemble disk image
        run: cargo run --locked --package xtask --target x86_64-unknown-linux-gnu -- image

      - name: Upload generated disk image
        uses: actions/upload-artifact@v4
        with:
          name: keefeos-disk-image
          path: KeefeOS/target/keefeos.img
          if-no-files-found: error
          retention-days: 7
